<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Хрестики-нулики</title>
    <style>
        .board { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; }
        .cell  { height: 64px; font-size: 30px; }
    
        .cell.player-1 {
            color: #ff4757;
        }
    
        .cell.player-2 {
            color: #2ed573;
        }
    </style>
</head>
<body>
    <div class="board" id="board"></div>   
    <p id="status"></p>
    <button id="reset">Нова гра</button>
    <script src="ttt.js"></script>         
    </body>
</html>
